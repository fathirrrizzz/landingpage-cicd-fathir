name: Deploy Landing Page Fathir ke GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Ambil Kode dari GitHub
        uses: actions/checkout@v4
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Unggah File Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
